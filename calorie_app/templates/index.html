<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Нутри-Помощник</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5efe7; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 20px; }
        button, input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 30px; border: 1px solid #ddd; }
        button { background: #d9c7b1; cursor: pointer; font-weight: bold; }
        .meal-buttons { display: flex; gap: 10px; margin: 15px 0; }
        .meal-btn { flex: 1; text-align: center; background: #eee; padding: 10px; border-radius: 30px; cursor: pointer; }
        .meal-btn.active { background: #d9c7b1; font-weight: bold; }
        .suggestion { background: #f9f6f0; padding: 12px; margin: 8px 0; border-radius: 12px; cursor: pointer; }
        .suggestion:hover { background: #efe4d8; }
        .food-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .meal-section { margin-top: 20px; padding: 15px; background: #fefcf8; border-radius: 15px; }
        .total { text-align: right; font-weight: bold; margin-top: 10px; padding-top: 5px; border-top: 1px solid #ddd; }
        .profile-panel { background: #f9f6f0; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }
        .advice-box {
            background: #f1ede8;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 style="text-align:center;">Нутри-Помощник</h1>

    <div id="loginPanel" style="text-align:center; padding:20px;">
        <button id="googleBtn" onclick="window.location.href='/google/login'">Войти с Google</button>
    </div>

    <div id="appContent" style="display:none;">
        <p id="userInfo" style="margin-bottom:15px;"></p>

        <!-- Кнопка редактирования профиля -->
        <button id="editProfileBtn" style="background:#e8ddd0; margin-bottom:15px;">✏️ Редактировать профиль</button>

        <div id="profilePanel" class="profile-panel">
            <input type="text" id="userName" placeholder="Ваше имя">
            <div class="row-2">
                <div><input type="number" id="currentWeight" placeholder="Вес (кг)"></div>
                <div><input type="number" id="targetWeight" placeholder="Целевой вес (кг)"></div>
            </div>
            <div class="row-2">
                <div><input type="number" id="userAge" placeholder="Возраст (лет)"></div>
                <div><input type="number" id="userHeight" placeholder="Рост (см)"></div>
            </div>
            <button id="saveProfileBtn">Сохранить профиль</button>
        </div>

        <div class="meal-buttons">
            <div class="meal-btn active" data-meal="breakfast">Завтрак</div>
            <div class="meal-btn" data-meal="lunch">Обед</div>
            <div class="meal-btn" data-meal="dinner">Ужин</div>
        </div>

        <input type="text" id="searchInput" placeholder="Например: курица, гречка, яблоко">
        <button id="searchBtn">Найти БЖУ</button>
        <div id="searchResults"></div>

        <div id="breakfastSection" class="meal-section">
            <h3>Завтрак</h3>
            <div id="breakfastList"></div>
            <div id="breakfastTotal" class="total"></div>
        </div>

        <div id="lunchSection" class="meal-section">
            <h3>Обед</h3>
            <div id="lunchList"></div>
            <div id="lunchTotal" class="total"></div>
        </div>

        <div id="dinnerSection" class="meal-section">
            <h3>Ужин</h3>
            <div id="dinnerList"></div>
            <div id="dinnerTotal" class="total"></div>
        </div>

        <button id="adviceBtn">Получить совет от Mistral AI</button>
        <div id="adviceBox" class="advice-box"></div>
    </div>
</div>

<script>
    let currentMeal = 'breakfast';

    document.querySelectorAll('.meal-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.meal-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMeal = btn.dataset.meal;
        });
    });

    async function apiCall(url, method, body) {
        let res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: body ? JSON.stringify(body) : undefined
        });
        return res.json();
    }

    document.getElementById('googleBtn').addEventListener('click', () => {
        window.location.href = '/google/login';
    });

    // Кнопка редактирования профиля
    document.getElementById('editProfileBtn')?.addEventListener('click', () => {
        document.getElementById('profilePanel').style.display = 'block';
    });

    async function checkAuth() {
        let data = await apiCall('/api/me', 'GET');
        if (data.authenticated) {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            document.getElementById('userInfo').innerHTML = 'Здравствуйте, ' + (data.name || data.email);
            if (data.has_profile) {
                // Заполняем поля текущими данными
                document.getElementById('userName').value = data.name || '';
                document.getElementById('currentWeight').value = data.current_weight || '';
                document.getElementById('targetWeight').value = data.target_weight || '';
                document.getElementById('userAge').value = data.age || '';
                document.getElementById('userHeight').value = data.height || '';
                // Скрываем анкету, если не нажата кнопка редактирования
                if (document.getElementById('profilePanel').style.display !== 'block') {
                    document.getElementById('profilePanel').style.display = 'none';
                }
            } else {
                document.getElementById('profilePanel').style.display = 'block';
            }
            loadMeals();
        }
    }

    document.getElementById('saveProfileBtn')?.addEventListener('click', async () => {
        let name = document.getElementById('userName').value;
        let current_weight = parseFloat(document.getElementById('currentWeight').value);
        let target_weight = parseFloat(document.getElementById('targetWeight').value);
        let age = parseInt(document.getElementById('userAge').value);
        let height = parseInt(document.getElementById('userHeight').value);

        if (!name || !current_weight || !target_weight || !age || !height) {
            alert('Заполните все поля');
            return;
        }
        await apiCall('/api/set_profile', 'POST', { name, current_weight, target_weight, age, height });
        alert('Профиль сохранён');
        document.getElementById('profilePanel').style.display = 'none';
        document.getElementById('userInfo').innerHTML = 'Здравствуйте, ' + name;
        loadMeals();
    });

    document.getElementById('searchBtn')?.addEventListener('click', async () => {
        let query = document.getElementById('searchInput').value;
        if (!query) return alert('Введите блюдо');
        document.getElementById('searchResults').innerHTML = '<div>Поиск...</div>';
        let data = await apiCall('/api/search', 'POST', { query: query });
        if (data.results && data.results.length > 0) {
            let html = '<div style="background:#e8f5e9; padding:10px; border-radius:12px;">';
            data.results.forEach(item => {
                html += `<div class="suggestion" onclick="addMeal('${item.name.replace(/'/g, "\\'")}', ${item.calories})">
                    ${item.name} - ${item.calories} ккал
                </div>`;
            });
            html += '</div>';
            document.getElementById('searchResults').innerHTML = html;
        } else {
            document.getElementById('searchResults').innerHTML = '<div>Ничего не найдено</div>';
            setTimeout(() => document.getElementById('searchResults').innerHTML = '', 2000);
        }
    });

    window.addMeal = async function(name, calories) {
        await apiCall('/api/add_meal', 'POST', {
            food_name: name,
            calories: calories,
            meal_type: currentMeal
        });
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResults').innerHTML = '';
        loadMeals();
    };

    async function loadMeals() {
        let data = await apiCall('/api/get_meals', 'GET');
        let meals = data.meals || [];

        let breakfast = [], lunch = [], dinner = [];
        meals.forEach(meal => {
            if (meal.meal_type === 'breakfast') breakfast.push(meal);
            else if (meal.meal_type === 'lunch') lunch.push(meal);
            else if (meal.meal_type === 'dinner') dinner.push(meal);
        });

        function renderList(elementId, items) {
            let container = document.getElementById(elementId);
            if (!items.length) {
                container.innerHTML = '<div style="color:#999;">Пусто</div>';
                return;
            }
            let html = '';
            items.forEach(item => {
                html += `<div class="food-item">
                            <span>${item.food_name}</span>
                            <span>${item.calories} ккал</span>
                         </div>`;
            });
            container.innerHTML = html;
        }

        renderList('breakfastList', breakfast);
        renderList('lunchList', lunch);
        renderList('dinnerList', dinner);

        let breakfastTotal = breakfast.reduce((s, m) => s + m.calories, 0);
        let lunchTotal = lunch.reduce((s, m) => s + m.calories, 0);
        let dinnerTotal = dinner.reduce((s, m) => s + m.calories, 0);

        document.getElementById('breakfastTotal').innerHTML = 'Итого: ' + breakfastTotal + ' ккал';
        document.getElementById('lunchTotal').innerHTML = 'Итого: ' + lunchTotal + ' ккал';
        document.getElementById('dinnerTotal').innerHTML = 'Итого: ' + dinnerTotal + ' ккал';
    }

    document.getElementById('adviceBtn')?.addEventListener('click', async () => {
        let btn = document.getElementById('adviceBtn');
        btn.innerText = 'Анализирую...';
        let data = await apiCall('/api/advice', 'GET');
        document.getElementById('adviceBox').innerHTML = data.advice;
        btn.innerText = 'Получить совет от Mistral AI';
    });

    checkAuth();
</script>
</body>
</html>
